# packages.yml - dbt package dependencies

packages:
  # dbt utilities for common macros and tests
  - package: dbt-labs/dbt_utils
    version: 1.1.1
    
  # Data quality and testing framework
  - package: calogica/dbt_expectations
    version: 0.10.1
    
  # Audit helper for comparing model versions
  - package: dbt-labs/audit_helper
    version: 0.9.0
    
  # Codegen for generating documentation and schema.yml
  - package: dbt-labs/codegen
    version: 0.12.1
