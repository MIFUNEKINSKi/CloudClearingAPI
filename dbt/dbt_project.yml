name: 'cloudclearing_analytics'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'cloudclearing'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
models:
  cloudclearing_analytics:
    # Staging models - Raw data ingestion with minimal transformation
    staging:
      +materialized: view
      +tags: ["staging"]
      +schema: staging
      
    # Intermediate models - Business logic transformations
    intermediate:
      +materialized: view
      +tags: ["intermediate"]
      +schema: intermediate
      
    # Marts - Final consumption layer
    marts:
      +materialized: table
      +tags: ["marts"]
      +schema: marts
      # Enable incremental for large datasets
      investment_dashboard:
        +materialized: incremental
        +unique_key: region_name
        +on_schema_change: "sync_all_columns"
      region_performance:
        +materialized: incremental
        +unique_key: ['region_name', 'analysis_date']
        +on_schema_change: "sync_all_columns"

# Test configurations
tests:
  +store_failures: true
  +schema: test_results

# Documentation
docs-paths: ["docs"]

# Variables for parameterization
vars:
  # Date range for incremental processing
  start_date: '2025-01-01'
  # Scoring thresholds
  high_priority_threshold: 70
  medium_priority_threshold: 50
  # Data quality
  max_days_old: 7
