# MkDocs Configuration for CloudClearingAPI
# CCAPI-30.1: MkDocs Documentation Site

site_name: CloudClearingAPI
site_description: Satellite-based land investment intelligence platform for Indonesia
site_author: Chris Moore
site_url: https://mifunekinsi.github.io/CloudClearingAPI/
repo_name: MIFUNEKINSKi/CloudClearingAPI
repo_url: https://github.com/MIFUNEKINSKi/CloudClearingAPI
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 Chris Moore

# Theme configuration
theme:
  name: material
  language: en
  
  # Color scheme
  palette:
    # Light mode
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    
    # Dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  # Font
  font:
    text: Roboto
    code: Roboto Mono
  
  # Features
  features:
    - navigation.tabs           # Top-level navigation tabs
    - navigation.tabs.sticky    # Sticky navigation tabs
    - navigation.sections       # Section navigation
    - navigation.expand         # Auto-expand sections
    - navigation.indexes        # Section index pages
    - navigation.top            # Back to top button
    - navigation.tracking       # URL tracking
    - toc.follow                # TOC follows scroll
    - toc.integrate             # TOC integrated in left sidebar
    - search.suggest            # Search suggestions
    - search.highlight          # Highlight search terms
    - search.share              # Share search query
    - content.code.copy         # Copy code button
    - content.code.annotate     # Code annotations
    - content.tabs.link         # Link tabs
  
  # Logo and favicon
  icon:
    repo: fontawesome/brands/github
    logo: material/satellite-variant
  
  # Custom overrides
  custom_dir: docs/overrides

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            show_if_no_docstring: false
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 80
            merge_init_into_class: true
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            
  - mermaid2:
      version: 10.6.1
      
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

# Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra configuration
extra:
  version:
    provider: mike
    default: latest
  
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MIFUNEKINSKi/CloudClearingAPI
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/your-profile
  
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  
  status:
    new: Recently added
    deprecated: Deprecated

# Additional CSS and JS
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

